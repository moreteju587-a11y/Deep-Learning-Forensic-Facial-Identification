{% extends "layout.html" %}
{% block title %}Something Went Wrong{% endblock %}
{% block content %}
<div class="container-x err-shell">
    <div>
        <div class="err-code text-grad">500</div>
        <h1 style="margin-bottom:10px">Something went wrong</h1>
        <p style="color:var(--muted);margin-bottom:26px">An unexpected error occurred on our end. Please try again.</p>
        <a href="{{ url_for('home') }}" class="btn-x btn-brand btn-lg-x">← Back to Home</a>
    </div>
</div>
{% endblock %}
